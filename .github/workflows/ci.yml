name: CI
on:
  push:
    # linux-probe/** branches run only .github/workflows/linux-probe.yml. A branch filter alone would exclude tags,
    # so tags are listed to keep running CI on every tag push as `on: [push, pull_request]` did.
    branches-ignore: ['linux-probe/**']
    tags: ['**']
  pull_request:
permissions:
  contents: read
# A newer push to a wave2/** fast-lane branch replaces its running fast lane. Every other run, the full pipeline
# included, has its own group and is never cancelled.
concurrency:
  group: ci-${{ github.ref }}-${{ startsWith(github.ref, 'refs/heads/wave2/') && !contains(github.ref, '/integration') && github.event_name == 'push' && 'fast-lane' || github.run_id }}
  cancel-in-progress: true
env:
  EDGEFFMPEG_CONTAINER_IMAGE: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
# Pipeline (docs/contributing/ci.md). plan picks the lane and the shards; reference provides the pinned native
# reference and Wasm codecs, from the cache when every pinned input is unchanged; one job per shard runs a slice of a
# suite with that suite's npm-script options. The full lane (every push except wave2/** feature branches, every tag
# and pull request) ends in report: compat:report --from-shards runs every other gate once and accepts the suites only
# when every test file ran in exactly one complete shard. The fast lane (wave2/** pushes) runs typecheck, lint and
# boundaries in checks and only the affected tests, checked by fast.
# Every job runs in the pinned Linux image (keep in sync with compat/reference-container.lock.json and the linux-x64
# entry of compat/reference-pins.json). The image runs steps as root over a runner-owned checkout, so each job hands the
# workspace to the image's unprivileged node user (uid 1000) and runs npm, the tools and the tests as that user: the
# permission tests refuse to run as root. Actions are pinned by commit, with the release in a comment. Checkouts do not
# persist the token: nothing after them needs it. See docs/contributing/linux-reference.md.
jobs:
  plan:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # Full history: the fast lane selects tests from the changes since the merge base with its base branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      - run: runuser -u node -- env HOME=/home/node npm ci
      # The step-output file is root-owned, so the planner writes its outputs to a file that root then appends.
      - id: plan
        run: |
          runuser -u node -- env HOME=/home/node GITHUB_OUTPUT="$GITHUB_WORKSPACE/.build/ci/outputs" node tools/ci/plan.mjs auto
          cat .build/ci/outputs >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-plan
          path: .build/ci/plan.json
          if-no-files-found: error
  reference:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    # actions: read only lets a cache miss reuse the reference-build artifact of another run of this repository.
    permissions:
      contents: read
      actions: read
    # The whole-tree manifest hash of the reference this run uses; every job that downloads it verifies it against this.
    outputs:
      tree-sha256: ${{ steps.tree.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      # Root runs git over a runner-owned checkout until the workspace is handed to node below.
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/ffmpeg"
      # The shallow submodule checkout has no tags, so FFmpeg's version.sh would embed the abbreviated commit instead
      # of n9.0.2 and the binaries would differ from the linux-x64 pin in compat/reference-pins.json.
      - name: Fetch the pinned FFmpeg release tag
        run: |
          tag=$(node -p "require('./compat/upstream.lock.json').tag")
          git -C upstream/ffmpeg fetch --no-tags --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          described=$(git -C upstream/ffmpeg describe --tags --always)
          echo "upstream/ffmpeg describes as $described"
          test "$described" = "$tag"
      # The cache key hashes every pinned input; the build steps below take their pins from the same outputs.
      - id: pins
        run: node tools/ci/reference-cache.mjs pins
      # Entries are saved as <key>-tree-<sha256 of the whole-tree manifest> by the job that built and verified the tree
      # (tools/ci/reference-tree.mjs), so the prefix restores the newest one. A restored entry is only a cache: every
      # file is checked against the hash in its key below, and bootstrap --check re-verifies ffmpeg, ffprobe, every
      # pinned library the oracles link and the codecs against compat/reference-pins.json and the codec locks, so a
      # wrong or incomplete entry fails explicitly instead of being used.
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: ${{ steps.pins.outputs.key }}
          restore-keys: ${{ steps.pins.outputs.key }}-tree-
          path: |
            .build/reference
            .build/codecs/openh264/openh264.wasm
            .build/codecs/flac/edge-flac.wasm
            .build/reference-tree.json
      # A cache entry is visible only to its branch and the default branch, so a first push of a branch looks for the
      # same key's build uploaded by another run of this repository (reference-build-<key>-tree-<sha256>). It is
      # verified exactly like a cache entry.
      - id: shared
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.pins.outputs.key }}
        run: node tools/ci/reference-cache.mjs find "$KEY"
      - if: steps.cache.outputs.cache-matched-key == '' && steps.shared.outputs.run-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.shared.outputs.artifact }}
          run-id: ${{ steps.shared.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .build
      # Every file of a restored tree must match the manifest hash its cache key or artifact name records.
      - name: Verify the whole restored tree against its recorded manifest hash
        if: steps.cache.outputs.cache-matched-key != '' || steps.shared.outputs.run-id != ''
        env:
          KEY: ${{ steps.pins.outputs.key }}
          MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
          SHARED_TREE: ${{ steps.shared.outputs.tree-sha256 }}
        run: |
          if [ -n "$MATCHED" ]; then
            node tools/ci/reference-tree.mjs verify --cache-key "$KEY" --matched-key "$MATCHED"
          else
            node tools/ci/reference-tree.mjs verify --sha256 "$SHARED_TREE"
          fi
      - run: npm ci
      - if: steps.cache.outputs.cache-matched-key == '' && steps.shared.outputs.run-id == ''
        name: Install codec build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake python3 xz-utils
      - if: steps.cache.outputs.cache-matched-key == '' && steps.shared.outputs.run-id == ''
        run: npm run reference:build
      - if: steps.cache.outputs.cache-matched-key == '' && steps.shared.outputs.run-id == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cisco/openh264
          ref: ${{ steps.pins.outputs.openh264-commit }}
          path: .build/vendor/openh264
          persist-credentials: false
      - if: steps.cache.outputs.cache-matched-key == '' && steps.shared.outputs.run-id == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: emscripten-core/emsdk
          ref: ${{ steps.pins.outputs.emsdk-commit }}
          path: .build/toolchains/emsdk
          persist-credentials: false
      - if: steps.cache.outputs.cache-matched-key == '' && steps.shared.outputs.run-id == ''
        name: Build the Wasm codecs from their locked inputs
        env:
          EMSDK_VERSION: ${{ steps.pins.outputs.emsdk-version }}
          FLAC_URL: ${{ steps.pins.outputs.flac-url }}
          FLAC_SHA256: ${{ steps.pins.outputs.flac-sha256 }}
          FLAC_ARCHIVE: ${{ steps.pins.outputs.flac-archive }}
          FLAC_SOURCE: ${{ steps.pins.outputs.flac-source }}
        run: |
          .build/toolchains/emsdk/emsdk install "$EMSDK_VERSION"
          .build/toolchains/emsdk/emsdk activate "$EMSDK_VERSION"
          npm run codec:h264:build -- --source .build/vendor/openh264 --emsdk .build/toolchains/emsdk
          mkdir -p .build/vendor
          curl --fail --location --retry 3 "$FLAC_URL" --output "$FLAC_ARCHIVE"
          echo "$FLAC_SHA256  $FLAC_ARCHIVE" | sha256sum --check
          tar -xJf "$FLAC_ARCHIVE" -C .build/vendor
          npm run codec:flac:build -- --source "$FLAC_SOURCE" --archive "$FLAC_ARCHIVE" --emsdk .build/toolchains/emsdk --out .build/codecs/flac
      # Artifacts do not keep the executable bit.
      - run: chmod +x .build/reference/ffmpeg .build/reference/ffprobe
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      # Generated unit/integration/Workers inputs (docs/contributing/environment-setup.md). Without
      # --allow-unpinned-reference this fails unless the reference equals the linux-x64 pin.
      # --check then re-verifies everything the artifact carries: ffmpeg, ffprobe and all six pinned libraries against
      # the linux-x64 pin, both Wasm modules against their locks, and the FLAC outputs against their lock.json content pins.
      - name: Generate the FLAC investigation inputs and verify every pin
        run: |
          runuser -u node -- env HOME=/home/node node tools/bootstrap/bootstrap.mjs --only flac-investigation
          runuser -u node -- env HOME=/home/node node tools/bootstrap/bootstrap.mjs --check
      # A built tree is recorded here, after bootstrap --check has matched it to the pins; a restored one is verified
      # again, so nothing since its restore changed it. The hash names the cache entry and the artifact below. The step
      # output file is root-owned, so the tool runs without GITHUB_OUTPUT and root appends the line it prints.
      - id: tree
        name: Record or re-verify the whole-tree manifest
        env:
          BUILT: ${{ steps.cache.outputs.cache-matched-key == '' && steps.shared.outputs.run-id == '' }}
          KEY: ${{ steps.pins.outputs.key }}
          MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
          SHARED_TREE: ${{ steps.shared.outputs.tree-sha256 }}
        run: |
          if [ "$BUILT" = true ]; then
            runuser -u node -- env HOME=/home/node GITHUB_OUTPUT= node tools/ci/reference-tree.mjs record > .build/ci-tree-output.txt
          elif [ -n "$MATCHED" ]; then
            runuser -u node -- env HOME=/home/node GITHUB_OUTPUT= node tools/ci/reference-tree.mjs verify --cache-key "$KEY" --matched-key "$MATCHED" > .build/ci-tree-output.txt
          else
            runuser -u node -- env HOME=/home/node GITHUB_OUTPUT= node tools/ci/reference-tree.mjs verify --sha256 "$SHARED_TREE" > .build/ci-tree-output.txt
          fi
          cat .build/ci-tree-output.txt
          grep '^sha256=' .build/ci-tree-output.txt >> "$GITHUB_OUTPUT"
      - name: Record where the reference came from
        env:
          MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
          SHARED_RUN: ${{ steps.shared.outputs.run-id }}
          TREE: ${{ steps.tree.outputs.sha256 }}
        run: |
          if [ -n "$MATCHED" ]; then source="cache $MATCHED"; elif [ -n "$SHARED_RUN" ]; then source="artifact of run $SHARED_RUN"; else source=built; fi
          echo "reference and codecs: $source; whole-tree manifest sha256 $TREE" | tee .build/bootstrap/reference-source.txt
      - if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: ${{ steps.pins.outputs.key }}-tree-${{ steps.tree.outputs.sha256 }}
          path: |
            .build/reference
            .build/codecs/openh264/openh264.wasm
            .build/codecs/flac/edge-flac.wasm
            .build/reference-tree.json
      - if: steps.cache.outputs.cache-matched-key == '' && steps.shared.outputs.run-id == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-build-${{ steps.pins.outputs.key }}-tree-${{ steps.tree.outputs.sha256 }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/reference/
            .build/codecs/openh264/openh264.wasm
            .build/codecs/flac/edge-flac.wasm
            .build/reference-tree.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-reference-and-codec
          include-hidden-files: true
          if-no-files-found: error
          # last-run.json is this job's bootstrap record, which the report job's reference-evidence carries as the
          # old workflow's did.
          path: |
            .build/reference/
            .build/codecs/openh264/openh264.wasm
            .build/codecs/flac/edge-flac.wasm
            .build/reference-tree.json
            .build/flac-investigation/native-cases.json
            .build/flac-investigation/native-error-cases.json
            .build/flac-investigation/malformed-prototype-result.json
            .build/bootstrap/last-run.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reference-provenance
          include-hidden-files: true
          path: |
            .build/reference/build-metadata.json
            .build/reference-tree.json
            .build/bootstrap/
      # Diagnostics when the reference or the bootstrap fails before the artifact above is uploaded.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: reference-diagnostics
          include-hidden-files: true
          path: |
            .build/reference/
            .build/bootstrap/
  checks:
    needs: plan
    if: needs.plan.outputs.mode == 'fast'
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      - run: runuser -u node -- env HOME=/home/node npm ci
      - run: runuser -u node -- env HOME=/home/node npm run typecheck
      - run: runuser -u node -- env HOME=/home/node npm run lint
      - run: runuser -u node -- env HOME=/home/node npm run boundaries
  # One job per shard of the plan. Shards only need the reference job's artifact, and fail explicitly without it.
  shard:
    name: test ${{ matrix.id }}
    needs: [plan, reference]
    if: needs.plan.outputs.shards != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      EDGEFFMPEG_CI_PLAN: ${{ needs.plan.outputs.plan }}
      SHARD_SUITE: ${{ matrix.suite }}
      SHARD_INDEX: ${{ matrix.index }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - name: Fetch the pinned FFmpeg release tag for bootstrap --check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/ffmpeg"
          tag=$(node -p "require('./compat/upstream.lock.json').tag")
          git -C upstream/ffmpeg fetch --no-tags --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worker-reference-and-codec
          path: .build
      - name: Verify every file of the reference against the reference job's manifest hash
        env:
          TREE: ${{ needs.reference.outputs.tree-sha256 }}
        run: node tools/ci/reference-tree.mjs verify --sha256 "$TREE"
      - run: chmod +x .build/reference/ffmpeg .build/reference/ffprobe
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      - run: runuser -u node -- env HOME=/home/node npm ci
      - run: runuser -u node -- env HOME=/home/node node tools/bootstrap/bootstrap.mjs --check
      # --prepare runs reference:extract first, so the shard tests the tree a serial compat:report run would test.
      - run: runuser -u node -- env HOME=/home/node node tools/ci/shard.mjs --suite "$SHARD_SUITE" --index "$SHARD_INDEX" --out .build/shards --prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: shard-${{ matrix.id }}
          include-hidden-files: true
          path: .build/shards/
  report:
    needs: [plan, reference, shard]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - name: Fetch the pinned FFmpeg release tag for bootstrap --check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/ffmpeg"
          tag=$(node -p "require('./compat/upstream.lock.json').tag")
          git -C upstream/ffmpeg fetch --no-tags --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worker-reference-and-codec
          path: .build
      - name: Verify every file of the reference against the reference job's manifest hash
        env:
          TREE: ${{ needs.reference.outputs.tree-sha256 }}
        run: node tools/ci/reference-tree.mjs verify --sha256 "$TREE"
      # A shard that uploaded nothing is reported as missing by compat:report, never skipped.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: shard-*
          merge-multiple: true
          path: .build/shards
      # The FATE gate runs make in .build/reference. An artifact does not keep the build tree's timestamps, and this
      # checkout's sources are newer than any restored object, so make would rebuild FFmpeg (and time out). One
      # timestamp, newer than the checkout, for every file of the restored tree makes make treat it as built, as it was
      # in the job that built it. reference-tree.mjs has verified every file's content above and bootstrap --check
      # verifies the programs and libraries; the report's referenceStable fails if make relinks either program.
      - name: Give the restored build tree one timestamp newer than the checkout
        run: find .build/reference -exec touch -h -d "@$(date +%s)" {} +
      - run: chmod +x .build/reference/ffmpeg .build/reference/ffprobe
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      - run: runuser -u node -- env HOME=/home/node npm ci
      - run: runuser -u node -- env HOME=/home/node node tools/bootstrap/bootstrap.mjs --check
      # Every gate that runs no test runs here, once; the four suites come from the shards.
      - run: runuser -u node -- env HOME=/home/node npm run compat:report -- --from-shards .build/shards
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reference-evidence
          include-hidden-files: true
          path: |
            compat/capabilities.json
            compat/reports/
            .build/reference/build-metadata.json
            .build/bootstrap/last-run.json
            .build/evidence/
            .build/fate-execution/
  fast:
    needs: [plan, reference, checks, shard]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'fast' }}
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    env:
      EDGEFFMPEG_CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: shard-*
          merge-multiple: true
          path: .build/shards
      - run: mkdir -p .build/shards && chown -R node:node "$GITHUB_WORKSPACE"
      - run: runuser -u node -- env HOME=/home/node node tools/ci/verify-fast.mjs --shards .build/shards --out .build/ci/fast
      - name: Require the reference and the typecheck, lint and boundaries checks
        env:
          REFERENCE: ${{ needs.reference.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "reference: $REFERENCE; checks: $CHECKS"
          test "$REFERENCE" = success && test "$CHECKS" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fast-lane
          path: .build/ci/fast/
