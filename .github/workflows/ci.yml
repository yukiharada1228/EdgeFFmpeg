name: CI
on:
  push:
    # linux-probe/** branches run only .github/workflows/linux-probe.yml.
    branches-ignore: ['linux-probe/**']
  pull_request:
permissions:
  contents: read
# Every job runs in the pinned Linux image (keep in sync with compat/reference-container.lock.json and the linux-x64
# entry of compat/reference-pins.json). The image runs steps as root over a runner-owned checkout, so each job hands the
# workspace to the image's unprivileged node user (uid 1000) and runs npm and the tests as that user: the permission
# tests refuse to run as root. See docs/contributing/linux-reference.md.
jobs:
  foundation:
    needs: reference
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: worker-reference-and-codec
          path: .build
      - run: chmod +x .build/reference/ffmpeg .build/reference/ffprobe
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      - run: runuser -u node -- env HOME=/home/node npm ci
      - run: runuser -u node -- env HOME=/home/node npm run check
  reference:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    env:
      EDGEFFMPEG_CONTAINER_IMAGE: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    steps:
      - name: Install codec build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake python3 xz-utils
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Root runs git over a runner-owned checkout until the workspace is handed to node below.
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/ffmpeg"
      # The shallow submodule checkout has no tags, so FFmpeg's version.sh would embed the abbreviated commit instead
      # of n9.0.2 and the binaries would differ from the linux-x64 pin in compat/reference-pins.json.
      - name: Fetch the pinned FFmpeg release tag
        run: |
          tag=$(node -p "require('./compat/upstream.lock.json').tag")
          git -C upstream/ffmpeg fetch --no-tags --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          described=$(git -C upstream/ffmpeg describe --tags --always)
          echo "upstream/ffmpeg describes as $described"
          test "$described" = "$tag"
      - run: npm ci
      - run: npm run reference:build
      - uses: actions/checkout@v4
        with:
          repository: cisco/openh264
          ref: 1bca62311e447fd9c39fc93de2c4b96cd5ce971c
          path: .build/vendor/openh264
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: 708dcbcc9ee23bc7d2dad44fc90db377e38b771c
          path: .build/toolchains/emsdk
          persist-credentials: false
      - run: .build/toolchains/emsdk/emsdk install 7.0.0
      - run: .build/toolchains/emsdk/emsdk activate 7.0.0
      - run: npm run codec:h264:build -- --source .build/vendor/openh264 --emsdk .build/toolchains/emsdk
      - name: Fetch verified libFLAC release inputs
        run: |
          mkdir -p .build/vendor
          curl --fail --location --retry 3 https://downloads.xiph.org/releases/flac/flac-1.5.0.tar.xz --output .build/vendor/flac-1.5.0.tar.xz
          echo 'f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920  .build/vendor/flac-1.5.0.tar.xz' | sha256sum --check
          tar -xJf .build/vendor/flac-1.5.0.tar.xz -C .build/vendor
      - run: npm run codec:flac:build -- --source .build/vendor/flac-1.5.0 --archive .build/vendor/flac-1.5.0.tar.xz --emsdk .build/toolchains/emsdk --out .build/codecs/flac
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      # Generated unit/integration/Workers inputs (docs/contributing/environment-setup.md). Without
      # --allow-unpinned-reference this fails unless the reference equals the linux-x64 pin.
      - name: Generate the FLAC investigation inputs against the pinned reference
        run: runuser -u node -- env HOME=/home/node node tools/bootstrap/bootstrap.mjs --only flac-investigation
      - uses: actions/upload-artifact@v4
        with:
          name: worker-reference-and-codec
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/reference/
            .build/codecs/openh264/openh264.wasm
            .build/codecs/flac/edge-flac.wasm
            .build/flac-investigation/native-cases.json
            .build/flac-investigation/native-error-cases.json
            .build/flac-investigation/malformed-prototype-result.json
      # Diagnostics when the reference or the bootstrap fails before the artifact above is uploaded.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reference-diagnostics
          include-hidden-files: true
          path: |
            .build/reference/
            .build/bootstrap/
      # Includes integration tests that invoke .build/reference/ffmpeg.
      - run: runuser -u node -- env HOME=/home/node npm run compat:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-evidence
          include-hidden-files: true
          path: |
            compat/capabilities.json
            compat/reports/
            .build/reference/build-metadata.json
            .build/bootstrap/last-run.json
            .build/evidence/
            .build/fate-execution/
  workers:
    needs: reference
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: worker-reference-and-codec
          path: .build
      - run: chmod +x .build/reference/ffmpeg .build/reference/ffprobe
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      - run: runuser -u node -- env HOME=/home/node npm ci
      - run: runuser -u node -- env HOME=/home/node npm run workers:types -- --check
      - run: runuser -u node -- env HOME=/home/node npm run test:workers
      - run: runuser -u node -- env HOME=/home/node npm run workers:bundle
