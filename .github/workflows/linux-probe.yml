name: Linux probe
# Runs selected tests and regenerates per-platform Native corpora on real x86_64 hardware in the pinned image, without
# the full CI. A linux-probe/** branch commits .github/linux-probe.json:
#   {"tests": ["tests/<suite>/<file>.test.ts", ...], "shards": n, "corpora": ["<descriptor id>", ...] | "all"}
# ci.yml ignores these branches. workflow_dispatch works only once this file is on the default branch.
# See docs/contributing/linux-reference.md.
on:
  push:
    branches: ['linux-probe/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  EDGEFFMPEG_CONTAINER_IMAGE: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard-list: ${{ steps.plan.outputs.shard-list }}
      corpora: ${{ steps.plan.outputs.corpora }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/ffmpeg"
      - name: Fetch the pinned FFmpeg release tag
        run: |
          tag=$(node -p "require('./compat/upstream.lock.json').tag")
          git -C upstream/ffmpeg fetch --no-tags --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git -C upstream/ffmpeg describe --tags --always)" = "$tag"
      - id: plan
        run: node tools/linux/probe.mjs plan
      # A restored entry is only a cache: the bootstrap steps below re-verify it against compat/reference-pins.json and
      # the codec locks, so a wrong entry fails explicitly instead of being used.
      - id: cache
        uses: actions/cache/restore@v4
        with:
          key: linux-probe-reference-v1-${{ hashFiles('compat/upstream.lock.json', 'compat/configure.flags', 'compat/reference-container.lock.json', 'tools/upstream-build/build.mjs', 'tools/codecs/**') }}
          path: |
            .build/reference
            .build/codecs/openh264/openh264.wasm
            .build/codecs/flac/edge-flac.wasm
      - run: npm ci
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install codec build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake python3 xz-utils
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm run reference:build
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: cisco/openh264
          ref: 1bca62311e447fd9c39fc93de2c4b96cd5ce971c
          path: .build/vendor/openh264
          persist-credentials: false
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: 708dcbcc9ee23bc7d2dad44fc90db377e38b771c
          path: .build/toolchains/emsdk
          persist-credentials: false
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the Wasm codecs as the CI reference job does
        run: |
          .build/toolchains/emsdk/emsdk install 7.0.0
          .build/toolchains/emsdk/emsdk activate 7.0.0
          npm run codec:h264:build -- --source .build/vendor/openh264 --emsdk .build/toolchains/emsdk
          mkdir -p .build/vendor
          curl --fail --location --retry 3 https://downloads.xiph.org/releases/flac/flac-1.5.0.tar.xz --output .build/vendor/flac-1.5.0.tar.xz
          echo 'f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920  .build/vendor/flac-1.5.0.tar.xz' | sha256sum --check
          tar -xJf .build/vendor/flac-1.5.0.tar.xz -C .build/vendor
          npm run codec:flac:build -- --source .build/vendor/flac-1.5.0 --archive .build/vendor/flac-1.5.0.tar.xz --emsdk .build/toolchains/emsdk --out .build/codecs/flac
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      - name: Generate the FLAC investigation inputs and verify every pin
        run: |
          runuser -u node -- env HOME=/home/node node tools/bootstrap/bootstrap.mjs --only flac-investigation
          runuser -u node -- env HOME=/home/node node tools/bootstrap/bootstrap.mjs --check
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            .build/reference
            .build/codecs/openh264/openh264.wasm
            .build/codecs/flac/edge-flac.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-probe-inputs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          path: |
            .build/reference/
            .build/codecs/openh264/openh264.wasm
            .build/codecs/flac/edge-flac.wasm
            .build/flac-investigation/native-cases.json
            .build/flac-investigation/native-error-cases.json
            .build/flac-investigation/malformed-prototype-result.json
  probe:
    needs: prepare
    if: needs.prepare.outputs.shards != '0'
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shard-list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/ffmpeg"
          tag=$(node -p "require('./compat/upstream.lock.json').tag")
          git -C upstream/ffmpeg fetch --no-tags --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
      - uses: actions/download-artifact@v4
        with:
          name: linux-probe-inputs
          path: .build
      - run: chmod +x .build/reference/ffmpeg .build/reference/ffprobe
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      - run: runuser -u node -- env HOME=/home/node npm ci
      - run: runuser -u node -- env HOME=/home/node node tools/bootstrap/bootstrap.mjs --check
      - run: runuser -u node -- env HOME=/home/node node tools/linux/probe.mjs test --shard ${{ matrix.shard }}/${{ needs.prepare.outputs.shards }} --out .build/linux-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-probe-shard-${{ matrix.shard }}
          include-hidden-files: true
          path: .build/linux-probe/
  corpora:
    needs: prepare
    if: needs.prepare.outputs.corpora != ''
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/ffmpeg"
          tag=$(node -p "require('./compat/upstream.lock.json').tag")
          git -C upstream/ffmpeg fetch --no-tags --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
      - uses: actions/download-artifact@v4
        with:
          name: linux-probe-inputs
          path: .build
      - run: chmod +x .build/reference/ffmpeg .build/reference/ffprobe
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      - run: runuser -u node -- env HOME=/home/node npm ci
      - run: runuser -u node -- env HOME=/home/node node tools/bootstrap/bootstrap.mjs --check
      - run: runuser -u node -- env HOME=/home/node node tools/linux/generate-corpora.mjs --only "${{ needs.prepare.outputs.corpora }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-corpora
          include-hidden-files: true
          path: |
            compat/behavior-specs/**/linux-x64/**
            .build/linux-corpora/summary.json
